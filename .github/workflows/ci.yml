name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (tsc -b across all packages)
        run: npm run typecheck
      - name: Test (vitest — full suite)
        run: npm test
      - name: Web typecheck (apps/web)
        run: npm run web:typecheck
      - name: Web build (Next.js production build)
        run: npm run web:build
